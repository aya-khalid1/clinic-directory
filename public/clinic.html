        /**
         * Navigation & UI Helpers
         */
        function navigateTo(view, doctorId = null) {
            try {
                AppState.currentView = view;
                if (doctorId !== null) {
                    AppState.selectedDoctorId = doctorId;
                }
                updateActiveNavStyles();
                updateAppointmentBadge();
                renderCurrentView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                console.error('Navigation error:', err);
                showToast('Unable to switch page. Please try again.', 'error');
            }
        }

        function updateActiveNavStyles() {
            const activeView = AppState.currentView === 'doctor-detail' ? 'doctors' : AppState.currentView;
            document.querySelectorAll('.nav-link').forEach(btn => {
                const isActive = btn.dataset.nav === activeView;
                btn.className = isActive
                    ? 'nav-link px-4 py-1.5 rounded-lg text-sm font-semibold smooth-transition bg-white dark:bg-slate-900 text-sky-600 dark:text-sky-400 shadow-sm flex items-center gap-1.5'
                    : 'nav-link px-4 py-1.5 rounded-lg text-sm font-semibold smooth-transition text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
            });

            document.querySelectorAll('.mobile-nav-link').forEach(btn => {
                const isActive = btn.dataset.nav === activeView;
                btn.className = isActive
                    ? 'mobile-nav-link flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-sky-600 dark:text-sky-400'
                    : 'mobile-nav-link flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-slate-500 dark:text-slate-400';
            });
        }

        function updateAppointmentBadge() {
            const badge = document.getElementById('appt-count-badge');
            if (badge) {
                badge.textContent = AppState.appointments.length;
            }
        }

        function showToast(message, type = 'success') {
            AppState.toastMessage = { message, type };
            renderToast();
            setTimeout(() => {
                AppState.toastMessage = null;
                renderToast();
            }, 3500);
        }

        function renderToast() {
            let toastEl = document.getElementById('toast-notification');
            if (!AppState.toastMessage) {
                if (toastEl) toastEl.remove();
                return;
            }
            if (!toastEl) {
                toastEl = document.createElement('div');
                toastEl.id = 'toast-notification';
                toastEl.className = 'fixed bottom-5 right-5 z-50 max-w-sm w-full px-4 py-3 rounded-xl shadow-xl border flex items-center gap-3 text-sm font-semibold smooth-transition';
                document.body.appendChild(toastEl);
            }
            const isSuccess = AppState.toastMessage.type === 'success';
            toastEl.className = isSuccess
                ? 'fixed bottom-5 right-5 z-50 max-w-sm w-full px-4 py-3 rounded-xl shadow-xl border bg-emerald-600 border-emerald-500 text-white flex items-center gap-3 text-sm font-semibold'
                : 'fixed bottom-5 right-5 z-50 max-w-sm w-full px-4 py-3 rounded-xl shadow-xl border bg-rose-600 border-rose-500 text-white flex items-center gap-3 text-sm font-semibold';

            toastEl.innerHTML = `
                <i class="fas ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i>
                <span>${AppState.toastMessage.message}</span>
            `;
        }

        /**
         * View Renderers
         */
        function renderCurrentView() {
            const container = document.getElementById('main-content');
            if (!container) return;

            switch (AppState.currentView) {
                case 'home':
                    container.innerHTML = renderHomeView();
                    attachHomeEvents();
                    break;
                case 'clinics':
                    container.innerHTML = renderClinicsView();
                    attachClinicsEvents();
                    break;
                case 'doctors':
                    container.innerHTML = renderDoctorsView();
                    attachDoctorsEvents();
                    break;
                case 'doctor-detail':
                    container.innerHTML = renderDoctorDetailView(AppState.selectedDoctorId);
                    attachDoctorDetailEvents(AppState.selectedDoctorId);
                    break;
                case 'appointments':
                    container.innerHTML = renderAppointmentsView();
                    attachAppointmentsEvents();
                    break;
                default:
                    container.innerHTML = renderHomeView();
                    attachHomeEvents();
            }
        }

                                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                                        Day & Time Slot <span class="text-rose-500">*</span>
                                    </label>
                                    <select
                                        id="patient-slot"
                                        class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-sky-500"
                                    >
                                        ${allSlots.map(s => `<option value="${s}">${s}</option>`).join('')}
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                                        Visit Notes (Optional)
                                    </label>
                                    <textarea
                                        id="patient-notes"
                                        rows="2"
                                        placeholder="Symptoms or reason for visit..."
                                        class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-sky-500"
                                    ></textarea>
                                </div>

                                <button
                                    type="submit"
                                    class="w-full py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md shadow-teal-600/20 smooth-transition flex items-center justify-center gap-2"
                                >
                                    <i class="fas fa-check-circle"></i>
                                    <span>Confirm Appointment</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function attachDoctorDetailEvents(doctorId) {
            const doc = DoctorsData.find(d => d.id === doctorId) || DoctorsData[0];
            const backBtn = document.getElementById('back-to-doctors-btn');
            const form = document.getElementById('booking-form');

            if (backBtn) {
                backBtn.addEventListener('click', () => navigateTo('doctors'));
            }

            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const nameEl = document.getElementById('patient-name');
                    const phoneEl = document.getElementById('patient-phone');
                    const dateEl = document.getElementById('patient-date');
                    const slotEl = document.getElementById('patient-slot');
                    const notesEl = document.getElementById('patient-notes');

                    const errName = document.getElementById('err-name');
                    const errPhone = document.getElementById('err-phone');
                    const errDate = document.getElementById('err-date');

                    [errName, errPhone, errDate].forEach(el => {
                        if (el) {
                            el.textContent = '';
                            el.classList.add('hidden');
                        }
                    });

                    let isValid = true;
                    const nameVal = nameEl.value.trim();
                    const phoneVal = phoneEl.value.trim();
                    const dateVal = dateEl.value.trim();

                    if (nameVal.length < 2) {
                        errName.textContent = 'Please enter the patient full name.';
                        errName.classList.remove('hidden');
                        isValid = false;
                    }

                    if (!/^[0-9+\-\s]{7,15}$/.test(phoneVal)) {
                        errPhone.textContent = 'Please enter a valid phone number.';
                        errPhone.classList.remove('hidden');
                        isValid = false;
                    }

                    if (!dateVal) {
                        errDate.textContent = 'Please select an appointment date.';
                        errDate.classList.remove('hidden');
                        isValid = false;
                    }

                    if (!isValid) return;

                    const newAppointment = {
                        id: 'APT-' + Math.floor(1000 + Math.random() * 9000),
                        doctorId: doc.id,
                        doctorName: doc.name,
                        specialty: doc.specialty,
                        clinicName: doc.clinicName,
                        city: doc.city,
                        patientName: nameVal,
                        phone: phoneVal,
                        date: dateVal,
                        timeSlot: slotEl.value,
                        notes: notesEl.value.trim() || 'General consultation',
                        status: 'Confirmed'
                    };

                    AppState.appointments.unshift(newAppointment);
                    updateAppointmentBadge();
                    showToast(`Appointment booked with ${doc.name}!`);
                    navigateTo('appointments');
                });
            }
        }

        function renderAppointmentsView() {
            return `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">My Appointments</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                            View or cancel scheduled clinic visits
                        </p>
                    </div>
                    <button data-nav="doctors" class="self-start sm:self-auto px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs sm:text-sm font-bold smooth-transition">
                        + Book Another Appointment
                    </button>
                </div>

                ${AppState.appointments.length > 0 ? `
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-xs uppercase text-slate-500 dark:text-slate-400">
                                        <th class="py-3.5 px-4">Reference</th>
                                        <th class="py-3.5 px-4">Doctor & Specialty</th>
                                        <th class="py-3.5 px-4">Clinic & City</th>
                                        <th class="py-3.5 px-4">Patient</th>
                                        <th class="py-3.5 px-4">Date & Slot</th>
                                        <th class="py-3.5 px-4">Status</th>
                                        <th class="py-3.5 px-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                    ${AppState.appointments.map(apt => `
                                        <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 smooth-transition">
                                            <td class="py-3.5 px-4 font-mono text-xs font-bold text-sky-600 dark:text-sky-400">${apt.id}</td>
                                            <td class="py-3.5 px-4">
                                                <div class="font-bold text-slate-900 dark:text-white">${apt.doctorName}</div>
                                                <div class="text-xs text-slate-500">${apt.specialty}</div>
                                            </td>
                                            <td class="py-3.5 px-4">
                                                <div class="font-semibold text-slate-800 dark:text-slate-200">${apt.clinicName}</div>
                                                <div class="text-xs text-slate-500">${apt.city}</div>
                                            </td>
                                            <td class="py-3.5 px-4">
                                                <div class="font-semibold text-slate-800 dark:text-slate-200">${apt.patientName}</div>
                                                <div class="text-xs text-slate-500">${apt.phone}</div>
                                            </td>
                                            <td class="py-3.5 px-4">
                                                <div class="font-semibold text-slate-800 dark:text-slate-200">${apt.date}</div>
                                                <div class="text-xs text-teal-600 dark:text-teal-400 font-semibold">${apt.timeSlot}</div>
                                            </td>
                                            <td class="py-3.5 px-4">
                                                <span class="px-2.5 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold">
                                                    ${apt.status}
                                                </span>
                                            </td>
                                            <td class="py-3.5 px-4 text-right">
                                                <button data-apt-id="${apt.id}" class="cancel-apt-btn px-3 py-1.5 rounded-lg text-xs font-bold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50 border border-rose-200 dark:border-rose-900/50 smooth-transition">
                                                    Cancel
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : `
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-12 text-center">
                        <i class="fas fa-calendar-xmark text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-white">No Appointments Scheduled</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-5">Browse our doctors and book your first clinic appointment.</p>
                        <button data-nav="doctors" class="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-bold smooth-transition">
                            Browse Doctors
                        </button>
                    </div>
                `}
            `;
        }

        function attachAppointmentsEvents() {
            document.querySelectorAll('.cancel-apt-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const aptId = btn.dataset.aptId;
                    AppState.appointments = AppState.appointments.filter(a => a.id !== aptId);
                    updateAppointmentBadge();
                    showToast('Appointment cancelled.', 'error');
                    renderCurrentView();
                });
            });
        }

        /**
         * Global Event Delegation & Initialization
         */
        document.addEventListener('click', (e) => {
            const navTrigger = e.target.closest('[data-nav]');
            if (navTrigger) {
                e.preventDefault();
                navigateTo(navTrigger.dataset.nav);
            }
        });

        const brandBtn = document.getElementById('brand-home-btn');
        if (brandBtn) {
            brandBtn.addEventListener('click', () => navigateTo('home'));
        }

        window.addEventListener('error', () => {
            const errBanner = document.getElementById('app-error-banner');
            if (errBanner) errBanner.classList.remove('hidden');
        });

        // Initial Render
        try {
            updateActiveNavStyles();
            updateAppointmentBadge();
            renderCurrentView();
        } catch (err) {
            console.error('Initialization failed:', err);
            const errBanner = document.getElementById('app-error-banner');
            if (errBanner) errBanner.classList.remove('hidden');
        }
    </script>
</body>
</html>
